<script>
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg',st=$('st');

for(let d=-360;d<=720;d+=5){const x=d*TS,M=d%45==0,m=d%15==0,l=M?13:m?8:5,dd=((d%360)+360)%360;ln(cg,{x1:x,y1:16,x2:x,y2:16+l,stroke:'currentColor','stroke-width':M?2:1});

el_('circle',{cx:GC[0],cy:GC[1],r:GR,fill:'none',stroke:'currentColor','stroke-opacity':.7},gs);

ln(gs,{x1:GC[0],y1:GC[1]-GR,x2:GC[0],y2:GC[1]+GR,stroke:'currentColor','stroke-opacity':.4});

const gtr=el_('polyline',{fill:'none',stroke:'currentColor','stroke-width':1.2,'stroke-opacity':.7},gs);

[['G-G',4,10,'start'],['ACC',83,10,'middle'],['BRK',83,131,'middle']].forEach(a=>{const t=el_('text',{x:a[1],y:a[2],'font-size':9,'text-anchor':a[3],fill:'currentColor','fill-opacity':.65},gs);t.textContent=a[0]});
for(let k=0;k<=8;k++){const y=4+k*8,l=k==4?12:6;ln($('rrt'),{x1:40,y1:y,x2:40+l,y2:y,'stroke-width':k==4?2:1})}
for(const id of['bF','bR'])for(let i=0;i<18;i++){const s=document.createElement('div');s.className='sg';$(id).appendChild(s)}
const P={mu:1.05,hang:4.5,hold:10,sign:1,hz:1,comp:1,fs:.48,hl:.47,Ltan:1.325*Math.tan(rad(25.65))};
const S={u:[0,1,0],u0:null,w:[0,0,0],a:[0,0,0],v:null,hdg:null,lean:0,lat:0,lon:0,mL:0,mR:0,tL:0,tR:0,bL:0,bR:0,pf:0,pr:0,pb:0,pa:0,rr:0,pl:0,pit:0,yaw:0,rad:null,t:0,over:false,bl:0,run:false,cs:0,csd:'R',cpk:0,ct:0,log:[],hl:[],hg:[],tr:[]};
try{const b=JSON.parse(localStorage.getItem('r15best')||'{}');S.bL=b.L||0;S.bR=b.R||0}catch(e){}

function onOri(e){if(e.beta==null)return;S.seen=1;const b=rad(e.beta),g=rad(e.gamma||0);S.u=[-Math.cos(b)*Math.sin(g),Math.sin(b),Math.cos(b)*Math.cos(g)];if(!S.u0)S.u0=S.u.slice()}

async function go(){try{
if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('Motion sensors permission needed');if(DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}

try{navigator.wakeLock&&await navigator.wakeLock.request('screen')}catch(e){}
if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{S.v=p.coords.speed;const h=p.coords.heading;if(h!=null&&!isNaN(h)&&p.coords.speed>1)S.hdg=h},()=>{S.v=null},{enableHighAccuracy:true,maximumAge:0});

$('flip').onclick=()=>{P.sign*=-1};
$('hzi').onclick=()=>{P.hz*=-1;$('hzi').textContent='HZ: '+(P.hz==1?'NORM':'INV')};

const lp=(a,b,k)=>a+(b-a)*k,p2=n=>String(Math.round(n)).padStart(2,'0'),p3=n=>String(Math.min(999,Math.round(n))).padStart(3,'0'),sg=(x,d)=>(x<0?'-':'+')+Math.abs(x).toFixed(d);
function frame(){
const u=S.u,u0=S.u0||[0,1,0],tn=performance.now(),dt=Math.min(.1,(tn-(S.t||tn))/1000);S.t=tn;
